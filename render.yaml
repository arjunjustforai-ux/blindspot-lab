# Render Blueprint (https://render.com/docs/blueprint-spec): Postgres with pgvector, API (with in-process
# worker and a persistent disk for uploads) and the web app.
# Not yet deployed by the team; see docs/DEPLOYMENT.md for the steps and the values to fill in.
databases:
  - name: blindspot-db
    plan: basic-256mb
    databaseName: blindspot
    user: blindspot
    postgresMajorVersion: "16"

services:
  - type: web
    name: blindspot-api
    runtime: docker
    plan: standard            # Whisper + embeddings need ~2 GB RAM
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    dockerCommand: api
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: blindspot-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: RUN_WORKER_IN_PROCESS
        value: "true"         # tested single-service mode; a separate worker needs shared (Supabase) storage
      - key: CORS_ORIGINS
        sync: false           # e.g. https://blindspot-web.onrender.com
      - key: LLM_PROVIDER
        value: local
      - key: OPENAI_API_KEY
        sync: false           # optional: enables generative mode
    disk:
      name: storage
      mountPath: /data/storage
      sizeGB: 5

  - type: web
    name: blindspot-web
    runtime: docker
    plan: starter
    dockerfilePath: apps/web/Dockerfile
    dockerContext: apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false           # the public URL of blindspot-api; needed at build time
