# Full local stack: PostgreSQL + pgvector, API, background worker and web app.
#   cp .env.example .env    # then set JWT_SECRET (and optionally OPENAI_API_KEY)
#   docker compose up --build
# Web: http://localhost:3000   API: http://localhost:8000/api/health
# The first start ingests the demo course pack in the worker (a few minutes on CPU).
name: blindspot-lab

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://blindspot:blindspot@db:5432/blindspot
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  LOCAL_STORAGE_DIR: /data/storage
  MODEL_CACHE_DIR: /models
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  LLM_PROVIDER: ${LLM_PROVIDER:-local}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  LLM_MODEL: ${LLM_MODEL:-}
  VERIFIER_MODEL: ${VERIFIER_MODEL:-}
  VISION_MODEL: ${VISION_MODEL:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-local}
  WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
  DEMO_ENABLED: ${DEMO_ENABLED:-true}
  RUN_WORKER_IN_PROCESS: "false"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: blindspot
      POSTGRES_PASSWORD: blindspot
      POSTGRES_DB: blindspot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blindspot -d blindspot"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: blindspot-api:latest
    command: ["api"]
    environment:
      <<: *api-env
      SEED_DEMO: "true"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    image: blindspot-api:latest
    command: ["worker"]
    environment: *api-env
    volumes:
      - storage:/data/storage
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  storage:
