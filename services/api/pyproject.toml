[project]
name = "blindspot-lab-api"
version = "1.0.0"
description = "Blindspot Lab API and worker: multimodal ingestion, grounded tutoring, verified adaptive assessment, misconception diagnosis and Bayesian knowledge tracing."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "pymupdf==1.28.2",
    "python-pptx==1.0.2",
    "faster-whisper==1.2.1",
    "fastembed==0.9.0",
    "onnxruntime==1.31.0",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "rapidfuzz==3.14.6",
    "numpy==2.5.4",
    "pytesseract==0.3.13",
    "pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
]
eval = [
    "matplotlib==3.11.2",
]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM108", "RUF012", "B904", "E731", "B023", "B905", "UP047", "RUF005", "RUF046", "SIM905", "RUF015", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs PostgreSQL+pgvector and local models",
    "slow: runs the full ingestion of the demo pack",
]
